server.port=${SERVER_PORT:8082}

# local profile: keep security disabled (overrides application.yml)
spring.security.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable docker compose auto-lifecycle during local dev
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-manager.enabled=false


